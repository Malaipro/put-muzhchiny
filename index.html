<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111310" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Путь Мужчины</title>
    <meta name="description" content="Трансформационная игра КЭМП — 72 клетки пути мужчины" />

    <!-- Keep first paint independent from external hosts and WebView SDKs. -->
    <style>
      html, body { margin: 0; min-height: 100%; background: #111310; color: #e8e1d3; }
      #boot-status {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 32px;
        font: 500 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }
    </style>

    <!--
      This watchdog is deliberately plain ES5. It must still explain a failed
      startup when the application bundle cannot be parsed or downloaded.
    -->
    <script>
      (function () {
        var failureCode = 'START-0';
        var failureDetail = '';

        function recordFailure(code, detail) {
          // Preserve the first failure: later errors are often consequences
          // and would hide the actual startup cause.
          if (failureCode !== 'START-0') return;
          failureCode = code;
          failureDetail = compactDetail(detail);
        }

        function compactDetail(value) {
          if (!value) return '';
          return String(value).replace(/\s+/g, ' ').slice(0, 140);
        }

        function fileName(value) {
          if (!value) return '';
          return String(value).split('#')[0].split('?')[0].split('/').pop();
        }

        window.addEventListener('error', function (event) {
          if (event && event.target && event.target !== window) {
            recordFailure('START-1', fileName(event.target.src || event.target.href));
            return;
          }

          recordFailure(
            'START-2',
            (event && event.message ? event.message : '')
              + (event && event.filename ? ' · ' + fileName(event.filename) : '')
              + (event && event.lineno ? ':' + event.lineno : '')
          );
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          recordFailure(
            'START-3',
            event && event.reason
              ? (event.reason.message || event.reason.name || event.reason)
              : ''
          );
        });

        window.setTimeout(function () {
          var status = document.getElementById('boot-status');
          if (!status) return;

          status.textContent = '';

          var message = document.createElement('div');
          var title = document.createElement('p');
          var detail = document.createElement('p');
          var retry = document.createElement('button');

          title.textContent = 'Игра не смогла запуститься';
          title.style.margin = '0 0 12px';
          title.style.fontSize = '20px';

          detail.textContent = 'Код: ' + failureCode
            + (failureDetail ? ' · ' + failureDetail : '')
            + '. Закрой и снова открой мини-приложение.';
          detail.style.margin = '0 0 20px';
          detail.style.color = '#918f86';
          detail.style.wordBreak = 'break-word';

          retry.type = 'button';
          retry.textContent = 'Повторить';
          retry.style.minHeight = '44px';
          retry.style.padding = '10px 24px';
          retry.style.border = '1px solid #b58a4a';
          retry.style.borderRadius = '12px';
          retry.style.background = '#20231e';
          retry.style.color = '#e8e1d3';
          retry.style.font = '600 16px/1.4 system-ui, sans-serif';
          retry.addEventListener('click', function () {
            window.location.reload();
          });

          message.appendChild(title);
          message.appendChild(detail);
          message.appendChild(retry);
          status.appendChild(message);
        }, 12000);
      }());
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-status">Игра загружается…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
