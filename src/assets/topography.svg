<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="topo" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
      <!-- Subtle topographic contour lines -->
      <path d="M50,100 Q100,50 150,100 T250,100 T350,100" fill="none" stroke="#8C5B37" stroke-width="0.5" opacity="0.08"/>
      <path d="M30,150 Q90,120 140,150 T240,150 T340,150" fill="none" stroke="#8C5B37" stroke-width="0.5" opacity="0.06"/>
      <path d="M70,200 Q120,160 170,200 T270,200 T370,200" fill="none" stroke="#8C5B37" stroke-width="0.5" opacity="0.1"/>
      <path d="M20,250 Q80,220 130,250 T230,250 T330,250" fill="none" stroke="#8C5B37" stroke-width="0.5" opacity="0.05"/>
      <path d="M60,300 Q110,260 160,300 T260,300 T360,300" fill="none" stroke="#8C5B37" stroke-width="0.5" opacity="0.08"/>
      <path d="M40,350 Q100,320 150,350 T250,350 T350,350" fill="none" stroke="#8C5B37" stroke-width="0.5" opacity="0.06"/>
      
      <!-- Vertical accents -->
      <path d="M100,40 Q130,90 100,140 T100,240 T100,340" fill="none" stroke="#8C5B37" stroke-width="0.5" opacity="0.05"/>
      <path d="M200,30 Q230,80 200,130 T200,230 T200,330" fill="none" stroke="#8C5B37" stroke-width="0.5" opacity="0.07"/>
      <path d="M300,50 Q330,100 300,150 T300,250 T300,350" fill="none" stroke="#8C5B37" stroke-width="0.5" opacity="0.05"/>
      
      <!-- Small dots like route markers -->
      <circle cx="100" cy="100" r="1.5" fill="#B58A4A" opacity="0.1"/>
      <circle cx="200" cy="200" r="1.5" fill="#B58A4A" opacity="0.08"/>
      <circle cx="300" cy="300" r="1.5" fill="#B58A4A" opacity="0.1"/>
      <circle cx="150" cy="250" r="1" fill="#B58A4A" opacity="0.06"/>
      <circle cx="250" cy="150" r="1" fill="#B58A4A" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#topo)"/>
</svg>
